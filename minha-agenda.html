<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Minha agenda | Bella Cachos</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="carregando" data-pagina="minha-agenda" data-titulo="Minha agenda">
    <main id="conteudo" class="page">
        <div class="header-row">
            <div>
                <div class="eyebrow">Minha área</div>
                <h1 id="ola">Olá!</h1>
                <p class="muted">Seus atendimentos de hoje, os próximos e o seu histórico.</p>
            </div>
            
        </div>
        <div class="grid kpis" id="kpis"></div>
        <div class="card mt">
            <div class="filters" id="abas" style="margin-bottom:18px">
                <button type="button" class="btn btn-soft" data-aba="hoje">Hoje</button>
                <button type="button" class="btn btn-soft" data-aba="proximos">Próximos</button>
                <button type="button" class="btn btn-soft" data-aba="historico">Histórico</button>
            </div>
            <div id="lista"></div>
        </div>
    </main>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
    <script src="js/paginas.js"></script>
</body>
</html>
