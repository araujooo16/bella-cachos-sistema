<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Agenda | Bella Cachos</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="carregando" data-pagina="agenda" data-titulo="Agenda">
    <main id="conteudo" class="page">
        <div class="header-row">
            <div>
                <div class="eyebrow">Agenda</div>
                <h1>Agenda de atendimentos</h1>
                <p class="muted">Visualize e organize os horários da equipe.</p>
            </div>
            <button type="button" class="btn btn-primary" data-novo-ag>+ Novo agendamento</button>
        </div>
        <div class="card">
            <div class="filters" id="controles">
                <button type="button" class="btn btn-soft" data-modo="dia">Dia</button>
                <button type="button" class="btn btn-soft" data-modo="semana">Semana</button>
                <button type="button" class="btn btn-soft" data-nav="-1" aria-label="Período anterior">‹</button>
                <button type="button" class="btn btn-soft" data-nav="0">Hoje</button>
                <button type="button" class="btn btn-soft" data-nav="1" aria-label="Próximo período">›</button>
                <label class="sr-only" for="f-dia">Data</label>
                <input type="date" id="f-dia" class="search" style="min-width:0">
                <label class="sr-only" for="f-prof">Profissional</label>
                <select id="f-prof" class="search" style="min-width:0"></select>
            </div>
            <h2 id="periodo" style="margin:22px 0 14px;text-transform:capitalize"></h2>
            <div id="lista"></div>
        </div>
    </main>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
    <script src="js/paginas.js"></script>
</body>
</html>
