<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Clientes | Bella Cachos</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="carregando" data-pagina="clientes" data-titulo="Clientes">
    <main id="conteudo" class="page">
        <div class="header-row">
            <div>
                <div class="eyebrow">Relacionamento</div>
                <h1>Clientes</h1>
                <p class="muted">Cadastro e histórico de clientes.</p>
            </div>
            <button type="button" class="btn btn-primary" data-novo-cliente>+ Novo cliente</button>
        </div>
        <div class="card">
            <label class="sr-only" for="busca">Buscar cliente</label>
            <input id="busca" class="search" placeholder="Buscar por nome ou WhatsApp...">
            <div id="tabela" style="margin-top:15px"></div>
        </div>
    </main>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
    <script src="js/paginas.js"></script>
</body>
</html>
